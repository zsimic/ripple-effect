[tox]
envlist = py{310,314}, coverage, style, ty, pyrefly, pyright, mypy, zuban, readme

[testenv]
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}
         PYTHONDONTWRITEBYTECODE=1
usedevelop = True
dependency_groups = test
commands = pytest {posargs:-vv --cov=src/ripple_effect tests}

[testenv:coverage]
setenv = COVERAGE_FILE={toxworkdir}/.coverage
skip_install = True
deps = coverage
commands = coverage combine
           coverage report -m
           coverage xml
           coverage html

[testenv:style]
skip_install = True
deps = ruff
commands = ruff check
           ruff format --diff

[testenv:reformat]
skip_install = True
deps = ruff
commands = ruff check --fix
           ruff format

[testenv:readme]
skip_install = True
deps = uv
       twine
commands = uv build -q --clear -o {env_dir}/dist
           twine check {env_dir}/dist/*


# Type checkers
# types-PyYAML: yaml has no inline type hints (mypy and zuban insist on stubs, the others use them when present)
[testenv:basedpyright]
deps = basedpyright
       types-PyYAML
# Without --pythonpath, basedpyright resolves imports against ./.venv rather than this tox env
commands = basedpyright --pythonpath {envpython} {posargs}

[testenv:mypy]
deps = mypy
       types-PyYAML
commands = mypy {posargs}

[testenv:pyrefly]
deps = pyrefly
       types-PyYAML
commands = pyrefly check {posargs}

[testenv:pyright]
deps = pyright
       types-PyYAML
commands = pyright {posargs}

[testenv:ty]
deps = ty
       types-PyYAML
commands = ty check {posargs}

[testenv:zuban]
deps = zuban
       types-PyYAML
# Without --python-executable, zuban doesn't resolve imports against this tox env
commands = zuban check --python-executable {envpython} {posargs}

[coverage:run]
data_file = .tox/.coverage
source = src
patch = subprocess
sigterm = True

[coverage:xml]
output = .tox/test-reports/coverage.xml

[coverage:html]
directory = .tox/test-reports/htmlcov

[pytest]
cache_dir = .tox/pytest_cache
testpaths = tests
